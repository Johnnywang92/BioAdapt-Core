[project]
name = "bioadapt-multiomics"
version = "0.1.0"
description = "Multi-omics analysis workflow, cross-modal integration, and conflict visibility (plan V2.0 sections 7.2, 7.5)"
requires-python = ">=3.12"
dependencies = [
    "bioadapt-schemas",
    "bioadapt-policies",
    "bioadapt-storage",
    "bioadapt-tool-registry",
]

[tool.uv.sources]
bioadapt-schemas = { workspace = true }
bioadapt-policies = { workspace = true }
bioadapt-storage = { workspace = true }
bioadapt-tool-registry = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
