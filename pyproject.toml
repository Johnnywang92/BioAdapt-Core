[project]
name = "bioadapt-core"
version = "0.1.0"
description = "AI-assisted single-cell multi-omics analysis platform (V2.0 plan implementation)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = ["packages/*", "services/*", "workflows/*"]

[tool.uv.sources]
bioadapt-schemas = { workspace = true }
bioadapt-tool-registry = { workspace = true }
bioadapt-policies = { workspace = true }
bioadapt-storage = { workspace = true }
bioadapt-api = { workspace = true }
bioadapt-orchestrator = { workspace = true }
bioadapt-scrnaseq = { workspace = true }
bioadapt-evidence = { workspace = true }
bioadapt-evaluation = { workspace = true }
bioadapt-knowledge = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "bioadapt-schemas",
    "bioadapt-tool-registry",
    "bioadapt-policies",
    "bioadapt-storage",
    "bioadapt-knowledge",
    "bioadapt-api",
    "bioadapt-orchestrator",
    "bioadapt-scrnaseq",
    "bioadapt-evidence",
    "bioadapt-evaluation",
]

[tool.pytest.ini_options]
testpaths = ["packages", "services", "workflows", "tests"]
