[project]
name = "bioadapt-tool-registry"
version = "0.1.0"
description = "Tool admission, promotion channel and result contract (plan V2.0 sections 9.4, 9.6)"
requires-python = ">=3.12"
dependencies = ["bioadapt-schemas"]

[tool.uv.sources]
bioadapt-schemas = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
