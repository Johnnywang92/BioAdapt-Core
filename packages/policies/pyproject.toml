[project]
name = "bioadapt-policies"
version = "0.1.0"
description = "Policy as code: egress allowlist, model routing, access control, injection defences (plan V2.0 sections 4.5, 9.7, 11.2-11.6)"
requires-python = ">=3.12"
dependencies = ["bioadapt-schemas"]

[tool.uv.sources]
bioadapt-schemas = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
