[project]
name = "bioadapt-knowledge"
version = "0.1.0"
description = "Local private knowledge base and RAG engine for single-cell multi-omics analysis (plan V2.0 section 6)"
requires-python = ">=3.12"
dependencies = [
    "bioadapt-schemas",
    "bioadapt-policies",
    "bioadapt-storage",
]

[tool.uv.sources]
bioadapt-schemas = { workspace = true }
bioadapt-policies = { workspace = true }
bioadapt-storage = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
