[project]
name = "bioadapt-orchestrator"
version = "0.1.0"
description = "Workflow state machine, approval gates and loop budget (plan V2.0 sections 9.1, 9.2, 9.7)"
requires-python = ">=3.12"
dependencies = ["bioadapt-schemas", "bioadapt-policies", "bioadapt-storage"]

[tool.uv.sources]
bioadapt-schemas = { workspace = true }
bioadapt-policies = { workspace = true }
bioadapt-storage = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
