[project]
name = "bioadapt-evidence"
version = "0.1.0"
description = "Evidence card service and model-decision wiring over stored tool products (plan V2.0 sections 7.2-7.8, 4.5, 11.5-11.6)"
requires-python = ">=3.12"
dependencies = ["bioadapt-schemas", "bioadapt-policies", "bioadapt-storage"]

[tool.uv.sources]
bioadapt-schemas = { workspace = true }
bioadapt-policies = { workspace = true }
bioadapt-storage = { workspace = true }

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
